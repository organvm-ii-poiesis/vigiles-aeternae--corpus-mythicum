name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check README exists
        run: test -f README.md && echo "README.md found"
      - name: Validate seed.yaml
        run: |
          if [ -f seed.yaml ]; then
            python3 -c "import yaml; yaml.safe_load(open('seed.yaml'))" && echo "seed.yaml valid"
          fi
      - name: Run tests
        run: make test
      - name: Run markdownlint
        run: npx markdownlint-cli2 "**/*.md"
